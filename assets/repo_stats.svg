<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" fill="none">
  <style>
    .title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .subtitle { font: 600 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8b949e; }
    .total-num { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .total-label { font: 600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 1px; }
    .diff-label { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .diff-count { font: 700 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #c9d1d9; }
    .diff-pct { font: 500 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8b949e; }
  </style>

  <rect x="1" y="1" width="498" height="198" rx="6" fill="#181818" stroke="#30363d" stroke-width="1.5"/>

  <g transform="translate(25, 22)">
    <svg width="22" height="22" viewBox="0 0 16 16" fill="#ffa116">
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
    </svg>
    <text x="32" y="17" class="title">interviews / repo</text>
    <text x="450" y="16" text-anchor="end" class="subtitle">17 Topics</text>
  </g>

  <g transform="translate(80, 122)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#2d2d2d" stroke-width="6"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#2cbb5d" stroke-width="6"
            stroke-dasharray="73.5 263.9" stroke-dashoffset="0" stroke-linecap="round"
            transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffc01e" stroke-width="6"
            stroke-dasharray="159.9 263.9" stroke-dashoffset="-73.5" stroke-linecap="round"
            transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ef4743" stroke-width="6"
            stroke-dasharray="30.5 263.9" stroke-dashoffset="-233.4" stroke-linecap="round"
            transform="rotate(-90)"/>
    <text x="0" y="5" text-anchor="middle" class="total-num">104</text>
    <text x="0" y="21" text-anchor="middle" class="total-label"> IN REPO</text>
  </g>

  <g transform="translate(175, 72)">
    <text x="0" y="12" class="diff-label">Easy</text>
    <text x="300" y="12" text-anchor="end" class="diff-count">29 <tspan class="diff-pct">(28%)</tspan></text>
    <rect x="0" y="20" width="300" height="5" rx="2.5" fill="#2d2d2d"/>
    <rect x="0" y="20" width="84" height="5" rx="2.5" fill="#2cbb5d"/>
  </g>

  <g transform="translate(175, 114)">
    <text x="0" y="12" class="diff-label">Medium</text>
    <text x="300" y="12" text-anchor="end" class="diff-count">63 <tspan class="diff-pct">(61%)</tspan></text>
    <rect x="0" y="20" width="300" height="5" rx="2.5" fill="#2d2d2d"/>
    <rect x="0" y="20" width="182" height="5" rx="2.5" fill="#ffc01e"/>
  </g>

  <g transform="translate(175, 156)">
    <text x="0" y="12" class="diff-label">Hard</text>
    <text x="300" y="12" text-anchor="end" class="diff-count">12 <tspan class="diff-pct">(11%)</tspan></text>
    <rect x="0" y="20" width="300" height="5" rx="2.5" fill="#2d2d2d"/>
    <rect x="0" y="20" width="35" height="5" rx="2.5" fill="#ef4743"/>
  </g>
